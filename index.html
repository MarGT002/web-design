<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate — Deguel</title>
  <link rel="icon" type="image/png" href="./assets/img/favicon.png">
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body class="page">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="navbar__container">
      <a class="navbar__brand" href="#">Deguel</a>

      <button class="navbar__toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>

      <ul class="navbar__menu" id="navMenu">
        <li class="navbar__item">
          <a class="navbar__link navbar__link--active" href="#">Inicio</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="page__main">
    <article class="card">

      <header class="card__header">
        <h1 class="card__title">Regístrate en nuestra plataforma</h1>
        <p class="card__subtitle">Solo te llevará unos segundos</p>
      </header>

      <section class="card__body">
        <fieldset class="form">
          <legend class="form__legend">Datos de registro</legend>

          <div class="form__field">
            <label class="form__label" for="nombre">Nombre Completo</label>
            <div class="form__input-wrapper">
              <span class="form__icon form__icon--user">👤</span>
              <input class="form__input" type="text" id="nombre" name="nombre"
                placeholder="Ej: Juan Perez" autocomplete="name" required>
            </div>
          </div>

          <div class="form__field">
            <label class="form__label" for="correo">Correo Electrónico</label>
            <div class="form__input-wrapper">
              <span class="form__icon form__icon--email">@</span>
              <input class="form__input" type="email" id="correo" name="correo"
                placeholder="ejemplo@gmail.com" autocomplete="email" required>
            </div>
          </div>

          <div class="form__field">
            <label class="form__label" for="contrasena">Contraseña</label>
            <div class="form__input-wrapper">
              <span class="form__icon form__icon--password">🔒</span>
              <input class="form__input" type="password" id="contrasena" name="contrasena"
                placeholder="crea una contraseña segura" autocomplete="new-password" required>
            </div>
          </div>

          <div class="form__field">
            <label class="form__label" for="plan">Selecciona tu plan</label>
            <select class="form__select" id="plan" name="plan" required>
              <option value="" disabled selected></option>
              <option value="basico">Básico</option>
              <option value="profesional">Profesional</option>
              <option value="empresarial">Empresarial</option>
            </select>
          </div>

          <div class="form__field">
            <label class="form__label" for="mensaje">Mensaje u Observaciones</label>
            <div class="form__input-wrapper form__input-wrapper--textarea">
              <span class="form__icon form__icon--message">💬</span>
              <textarea class="form__textarea" id="mensaje" name="mensaje"
                placeholder="Déjanos un mensaje si lo deseas..." rows="4"></textarea>
            </div>
          </div>

          <button class="form__btn form__btn--primary" type="submit">Crear Cuenta</button>

        </fieldset>
      </section>

      <footer class="card__footer">
        <p class="card__footer-text">
          ¿Ya tienes una cuenta?
          <a class="card__link" href="#">Iniciar sesión</a>
        </p>
        <p class="card__footer-text">
          Al registrarte, aceptas nuestros
          <a class="card__link" href="#">Términos y Condiciones</a>
        </p>
      </footer>

    </article>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="site-footer__container">

      <div class="site-footer__social">
        <a class="site-footer__social-link" href="#" aria-label="Facebook">

          </svg>
        </a>
        <a class="site-footer__social-link" href="#" aria-label="Instagram">

      </div>

      <p class="site-footer__copy">
        &copy; <time datetime="2026">2026</time> Mario García. Todos los derechos reservados.
      </p>

    </div>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const menu   = document.getElementById('navMenu');
    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('navbar__menu--open');
      toggle.setAttribute('aria-expanded', open);
    });
  </script>

</body>
</html>
